<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Registration</h1>
            <p>Fill in the details to register a student</p>
        </header>

        <section class="form-card">
            <h2>Student Details</h2>

            <form id="studentForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label>Register Number</label>
                        <input type="text" id="regNo" placeholder="Enter register number" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit phone number" required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option>BCA</option>
                            <option>B.Sc Computer Science</option>
                            <option>B.Com</option>
                            <option>BBA</option>
                            <option>BA</option>
                            <option>B.E</option>
                            <option>B.Tech</option>
                            <option>MCA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Year</label>
                        <select id="year" required>
                            <option value="">Select Year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea id="address" placeholder="Enter address" required></textarea>
                    </div>

                </div>

                <div class="buttons">
                    <button type="submit" class="submit-btn">Register Student</button>
                    <button type="reset" class="reset-btn">Clear Form</button>
                </div>
            </form>
        </section>

        <section class="table-card">
            <div class="table-heading">
                <h2>Registered Students</h2>
                <span id="studentCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Register No</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
